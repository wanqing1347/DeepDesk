[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepdesk-backend"
version = "0.1.0"
description = "DeepDesk FastAPI backend with search, file RAG, skills, deep research, and PPT generation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.4,<3",
    "sqlalchemy>=2.0,<3",
    "pymysql>=1.1,<2",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.13,<2",
    "minio>=7.2,<8",
    "pypdf>=6,<7",
    "python-docx>=1.1,<2",
    "python-pptx>=1.0,<2",
    "requests>=2.32,<3",
    "redis>=5,<7",
    "python-multipart>=0.0.20,<1",
    "pyyaml>=6,<7",
    "opentelemetry-api>=1.44,<2",
    "opentelemetry-sdk>=1.44,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.44,<2",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2,<3",
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: tests that call real external infrastructure/providers and require RUN_PHASE2_INTEGRATION=1",
    "golden: optional fixture-based behavior regression tests",
]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["resources/python/render_ppt.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# FastAPI dependency injection intentionally constructs Depends() in signatures.
ignore = ["B008", "RUF001"]

[tool.ruff.lint.isort]
known-third-party = ["alembic", "fastapi", "httpx", "pydantic", "sqlalchemy"]

